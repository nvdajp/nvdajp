name: NVAccess Beta Aligned TypeCheck (3.11 x86)

on:
  push:
    branches:
      - alphajp*
      - betajp*
      - releasejp*
  pull_request:
    branches:
      - alphajp*
      - betajp*
      - releasejp*
  workflow_dispatch:

jobs:
  typeCheck:
    name: Static type analysis (pyright)
    # BEGIN JP PATCH: Use overridable Windows runner (default windows-latest)
    runs-on: ${{ vars.JP_WINDOWS_RUNNER || 'windows-latest' }}
    # END JP PATCH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.11 x86
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x86'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run type check (pyright)
        shell: pwsh
        run: ci/scripts/tests/typeCheck.ps1
