name: Check JTalk Architecture (x64)

# x64 smoke tests: Enabled for pull_request to validate stability.
# Dictionary file check was added to checkJtalkArch.ps1 to fix standalone execution.
# If stable, push trigger can be enabled later.
on:
  pull_request:
    branches:
      - 'alphajp**'
      - 'betajp**'
      - 'releasejp**'
  workflow_dispatch:  # Manual trigger for testing
  # push:
  #   branches:
  #     - 'betajp'
  #     - 'releasejp'

jobs:
  checkJtalkArchX64:
    name: Check JTalk x64 DLLs and smoke tests
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup Python 3.11 x86 (for scons.bat)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x86'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install Python 3.11 x64 (for smoke tests)
      run: |
        # Install x64 Python explicitly for smoke tests
        # This ensures uv venv uses x64 Python instead of the x86 Python from setup-python
        uv python install 3.11
        uv python list
      shell: powershell

    - name: Setup MSVC environment (x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure git and verify tools
      run: |
        git config --global core.autocrlf true
        python --version
        uv --version
        # Verify dumpbin is available (should be in PATH after msvc-dev-cmd)
        # dumpbin /? may return non-zero exit code even when available, so check command existence instead
        $dumpbinFound = $false
        try {
          $null = Get-Command dumpbin -ErrorAction Stop
          $dumpbinFound = $true
          Write-Host "dumpbin found in PATH"
        } catch {
          Write-Host "WARNING: dumpbin not found in PATH, checkJtalkArch.ps1 will use vcvarsall.bat fallback"
        }
      shell: powershell

    - name: Disable Windows Error Reporting UI
      shell: powershell
      run: |
        # Disable Windows Error Reporting UI to prevent hang on access violation
        reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f
        reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f
        Write-Host "Windows Error Reporting UI disabled"

    - name: Build JTalk for x64 and run smoke tests
      run: |
        # scons.bat uses x86 Python from PATH (via uv run)
        # TARGET_ARCH=x64 controls the DLL build architecture (x64 DLLs are built)
        # checkJtalkArch.ps1 uses x64 Python for smoke tests (via .venv-x64 with UV_PYTHON_PREFERENCE=only-managed)
        .\jptools\checkJtalkArch.ps1 -Architecture x64 -RunSmokeTests
      shell: powershell
      env:
        TARGET_ARCH: x64

    - name: Upload artifact on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: JTalk x64 test results
        path: |
          miscDepsJp/jptools/__h2output.txt
          miscDepsJp/jptools/__jpBrailleHarness.md
          miscDepsJp/jptools/jpBrailleHarness.html
          source/synthDrivers/jtalk/*.dll
          source/synthDrivers/jtalk/mecab_debug.log
