name: CI/CD Japanese Version

on:
  push:
    branches:
      # BEGIN JP PATCH (nvdajp-specific branches only)
      - alphajp
      - betajp
      - releasejp
      # END JP PATCH
      # Original upstream branches (master, beta, rc, try-**, release-** tags) removed for nvdajp

  pull_request:
    branches:
      # BEGIN JP PATCH (nvdajp-specific branches only)
      - alphajp
      - betajp
      - releasejp
      # END JP PATCH
      # Original upstream branches (master, beta, rc) removed for nvdajp

  workflow_dispatch:

concurrency:
  # BEGIN JP PATCH (separate concurrency groups by event name so workflow_dispatch is not cancelled by push)
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_type }}-${{ github.event_name }}
  # END JP PATCH
  cancel-in-progress: true

env:
  START_BUILD_NUMBER: ${{ vars.BUILD_NUMBER_OFFSET || 0 }}
  pullRequestNumber: ${{ github.event_name == 'pull_request' && github.event.number || 0 }}
  # BEGIN JP PATCH (nvdajp-specific publisher)
  scons_publisher: ${{ vars.PUBLISHER_NAME || 'nvdajp' }}
  # END JP PATCH
  # Don't send telemetry to Microsoft when using MSVC tooling, avoiding an unnecessary PowerShell script invocation.
  VSCMD_SKIP_SENDTELEMETRY: 1
  # Cache details about available MSVC tooling for subsequent SCons invocations to the provided file.
  SCONS_CACHE_MSVC_CONFIG: ".scons_msvc_cache.json"
  defaultRunner: 'windows-2025-vs2026'
  supportedRunners: '["windows-2022", "windows-2025-vs2026"]'
  defaultArch: x64
  supportedArchitectures: '["x64"]'
  defaultPythonVersion: '3.13.13'
  supportedPythonVersions: '["3.13.13"]'
  # JP: Bump SCONS_CACHE_SUFFIX only when the JTalk/MeCab dic *build process* changes (e.g. make_jdic refactor, DIC_CODEPAGE requirement).
  # Bumped to v3: CI Verify JTalk dictionary was failing (一人→ヒトリ expected, got 1ニン) due to cached dic without nvdajp custom entries.
  # Bumped to v4: mecab-dict-index sources patched (config-charset UTF-8, ContextID
  # hardening) and dic makers now emit explicit context ids; cached .obj files
  # from the old sources must not be linked into the new tool.
  # Bumped to v5: force libopenjtalk rebuild so njd_set_digit stays SHIFT_JIS
  # (UTF-8 njd_set_digit + Mecab_utf8_to_cp932 breaks compound number readings).
  # Do not bump on every CI failure; investigate logs first.
  # See projectDocs/jp/tab-character-analysis.md "キャッシュキーで無効化".
  SCONS_CACHE_SUFFIX: "-jp-v5"

jobs:
  matrix:
    name: Set up matrix
    runs-on: ubuntu-latest
    outputs:
      defaultRunner: ${{ steps.setMatrix.outputs.defaultRunner }}
      supportedRunners: ${{ steps.setMatrix.outputs.supportedRunners }}
      supportedArchitectures: ${{ steps.setMatrix.outputs.supportedArchitectures }}
      supportedPythonVersions: ${{ steps.setMatrix.outputs.supportedPythonVersions }}
      # BEGIN JP PATCH (compute nowdate once for alphajp workflow_dispatch alpha release)
      nowdate: ${{ steps.setMatrix.outputs.nowdate }}
      # END JP PATCH
    steps:
    - name: Set architecture and python version
      id: setMatrix
      run: |
        echo "defaultRunner=${{ env.defaultRunner }}" >> "$GITHUB_OUTPUT"
        echo "supportedRunners=$(jq -c <<< '${{ env.supportedRunners }}')" >> "$GITHUB_OUTPUT"
        echo "supportedArchitectures=$(jq -c <<< '${{ env.supportedArchitectures }}')" >> "$GITHUB_OUTPUT"
        echo "supportedPythonVersions=$(jq -c <<< '${{ env.supportedPythonVersions }}')" >> "$GITHUB_OUTPUT"
        # BEGIN JP PATCH (compute JST nowdate once; used by buildNVDA/createLauncher/publishAlphaRelease)
        nowdate=$(python3 -c "from datetime import datetime, timedelta, timezone; jst = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))); print(f'{jst:%y%m%d}{chr(97+jst.hour)}')")
        echo "nowdate=$nowdate" >> "$GITHUB_OUTPUT"
        # END JP PATCH
  buildNVDA:
    name: Build NVDA
    needs: matrix
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    env:
      uv-arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'x86' }}
      # BEGIN JP PATCH (enable Azure Key Vault signing via repository variable, workflow_dispatch only)
      AZURE_KV_SIGNING: ${{ github.event_name == 'workflow_dispatch' && vars.AZURE_KV_SIGNING || '' }}
      # END JP PATCH
      # BEGIN JP PATCH (use nowdate computed once in matrix job)
      NOWDATE: ${{ needs.matrix.outputs.nowdate }}
      # END JP PATCH
    outputs:
      # Note: each output variable is overwritten by the last job in the matrix.
      # This is not a problem for these variables as they should be the same across jobs.
      version: ${{ steps.releaseInfo.outputs.VERSION }}
      versionType: ${{ steps.releaseInfo.outputs.VERSION_TYPE }}
      nowdate: ${{ steps.releaseInfo.outputs.NOWDATE }}
      APIVersion: ${{ steps.releaseInfo.outputs.NVDA_API_VERSION }}
      APIBackCompat: ${{ steps.releaseInfo.outputs.NVDA_API_COMPAT_TO }}
    steps:
    - name: Checkout NVDA
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: ${{ matrix.arch }}
        update-environment: true
    - name: Install Python (32 bit)
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: x86
        update-environment: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: cpython-${{ matrix.pythonVersion }}-windows-${{ env.uv-arch }}-none
    - name: Set version variables
      run: ci/scripts/setBuildVersionVars.ps1
    - name: Set scons args
      run: ci/scripts/setSconsArgs.ps1
      env:
        apiSigningToken: ${{ github.event_name == 'push' && secrets.API_SIGNING_TOKEN || '' }}
    - name: Set cache key for SCons MSVC Cache
      shell: bash
      run: echo "SCONS_CACHE_KEY=${RUNNER_OS}-${ImageVersion}" >> $GITHUB_ENV
    # On Github Actions, it can take more than two minutes for SCons to collect information about MSVC tooling, majorly impacting build performance.
    # This information is static for the current Github Actions runner image.
    # Therefore, cache this information with a key scoped to the current image version, ensuring that subsequent workflow runs will be much faster.
    - name: SCons MSVC Cache
      uses: actions/cache@v5
      with:
        path: ${{ env.SCONS_CACHE_MSVC_CONFIG }}
        key: ${{ env.SCONS_CACHE_KEY }}
    # BEGIN JP PATCH (JP-specific build preparation)
    # Force dictionary rebuild so custom entries (一人→ヒトリ etc.) are always included.
    # Remove dic dir AND SCons stamp so jtalkSync is not skipped (stamp would make SCons think it's up to date).
    # Exclusion from cache (below) prevents stale dic propagation to restore jobs.
    - name: Force JTalk dictionary rebuild (JP-specific)
      shell: pwsh
      run: |
        $dicDir = "source\synthDrivers\jtalk\dic"
        if (Test-Path $dicDir) {
          Remove-Item -Path $dicDir -Recurse -Force
          Write-Host "Removed $dicDir to force fresh dictionary build"
        }
        $stampDir = "miscDepsJp\_state\prep"
        if (Test-Path $stampDir) {
          Get-ChildItem $stampDir -Filter "jtalkSync.*.stamp" -ErrorAction SilentlyContinue | Remove-Item -Force
          Write-Host "Removed jtalkSync stamp files to force SCons rebuild"
        }
    - name: Prepare JTalk (JP-specific)
      shell: cmd
      # Dictionary is UTF-8 (make_jdic.py); do not rely on chcp 932 in GHA — it does not propagate reliably.
      run: scons jtalkPrep jtalkSync %sconsArgs% %sconsCores%
    - name: Diagnose JTalk dictionary (JP-specific)
      if: always()
      shell: pwsh
      run: |
        $dicDir = "source\synthDrivers\jtalk\dic"
        Write-Host "=== JTalk dictionary state after jtalkSync ==="
        if (Test-Path $dicDir) {
          Get-ChildItem $dicDir | ForEach-Object { Write-Host "  $($_.Name)" }
          $ver = Join-Path $dicDir "DIC_VERSION"
          if (Test-Path $ver) { Write-Host "DIC_VERSION: $(Get-Content $ver -Raw)" }
          $cp = Join-Path $dicDir "DIC_CODEPAGE"
          if (Test-Path $cp) { Write-Host "DIC_CODEPAGE: $(Get-Content $cp -Raw)" }
          $dicrc = Join-Path $dicDir "dicrc"
          if (Test-Path $dicrc) {
            $charsetLine = Get-Content $dicrc | Where-Object { $_ -match "^config-charset" } | Select-Object -First 1
            if ($charsetLine) { Write-Host "dicrc: $charsetLine" }
          }
        } else {
          Write-Host "  dic directory does not exist"
        }
        Write-Host "make_jdic.py exists: $(Test-Path 'miscDepsJp\jptools\jtalk\make_jdic.py')"
    - name: Verify JTalk dictionary
      # BEGIN JP PATCH (run verification in UTF-8 PowerShell to avoid log mojibake and extra code-page state)
      # -Strict: the dictionary build is not reproducible (mecab-dict-index can
      # emit a sys.dic whose entries exist but are unreachable via the index, even
      # on the same runner image), and the basic cases pass against such a broken
      # dictionary. Strict cases fail the build here instead of surfacing later as
      # a flaky test_translator2 in jpSmokeTests.
      # See projectDocs/jp/tab-character-analysis.md "test_translator2 の失敗と辞書ビルドの非再現性".
      shell: pwsh
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: powershell -ExecutionPolicy Bypass -File jptools/verifyJtalkDictionary.ps1 -Strict
      # END JP PATCH
    # END JP PATCH
    - name: Install signPath
      env:
        apiSigningToken: ${{ github.event_name == 'push' && secrets.API_SIGNING_TOKEN || '' }}
      if: ${{ env.apiSigningToken }}
      shell: cmd
      run: |
        PowerShell -Command "Set-ExecutionPolicy Bypass"
        PowerShell -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted"
        PowerShell -Command "Install-Module -Name SignPath -Force"
    # BEGIN JP PATCH (install AzureSignTool before Azure KV signing)
    - name: Install AzureSignTool
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      shell: pwsh
      run: |
        dotnet tool install --global AzureSignTool --version 7.0.1
        Join-Path $env:USERPROFILE ".dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # END JP PATCH
    # BEGIN JP PATCH (Azure Key Vault signing with OIDC - workflow_dispatch only)
    - name: Login to Azure for Key Vault signing
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set Azure Key Vault access token
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      shell: pwsh
      run: |
        $token = (az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)
        if (-not $token) { throw "Failed to obtain Azure Key Vault access token" }
        Write-Host "::add-mask::$token"
        "AZURE_KV_ACCESS_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # END JP PATCH
    - name: Prepare source code
      shell: cmd
      run: scons source %sconsArgs% %sconsCores%
    - name: Run synthDriverHost32 runtime builder with its own Python
      shell: pwsh
      env:
        UV_PYTHON: ""          # clear setup-uv override
        VIRTUAL_ENV: ""        # avoid inheriting outer venv
      run: |
        uv run --no-active --directory runtime-builders/synthDriverHost32 python setup-runtime.py --dest-dir ../../source/lib/x86/synthDriverHost-runtime --version "$env:version" --publisher "$env:scons_publisher"
    - name: Prepare for tests
      run: ci/scripts/tests/beforeTests.ps1
    # BEGIN JP PATCH (ship JTalk runtime separately from workspace cache to avoid stale dic propagation)
    - name: Upload JTalk runtime artifact
      uses: actions/upload-artifact@v7
      with:
        name: JTalk runtime (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: |
          source/synthDrivers/jtalk/dic
          source/synthDrivers/jtalk/libmecab.dll
          source/synthDrivers/jtalk/libopenjtalk.dll
    # END JP PATCH
    # JP: Dic is included in cache. Invalidate via SCONS_CACHE_SUFFIX bump when dic build changes.
    - name: Cache scons build
      uses: actions/cache/save@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
    # BEGIN JP PATCH (build JP addons on alphajp workflow_dispatch so they can be attached to GitHub Release)
    - name: Build JP addons
      if: ${{ github.ref_name == 'alphajp' && github.event_name == 'workflow_dispatch' }}
      shell: pwsh
      env:
        VERSION: ${{ env.nowdate }}
      run: |
        uv run --no-active python jptools/pack_jtalk_addon.py --nowdate "$env:VERSION"
        uv run --no-active python jptools/pack_kgs_addon.py --version "$env:VERSION"
    - name: Upload JP addon artifacts
      if: ${{ github.ref_name == 'alphajp' && github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v7
      with:
        name: JP addons (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: |
          jptools/nvdajp-jtalk-*.nvda-addon
          jptools/kgsbraille-*.nvda-addon
    # END JP PATCH
    - name: Store release metadata information
      id: releaseInfo
      run: |
        Write-Output VERSION=$env:version >> $env:GITHUB_OUTPUT
        Write-Output NOWDATE=$env:nowdate >> $env:GITHUB_OUTPUT
        Write-Output VERSION_TYPE=$env:versionType >> $env:GITHUB_OUTPUT
        Write-Output NVDA_API_VERSION=$(python -c "import sys; sys.path.append('source'); from addonAPIVersion import CURRENT; print('{}.{}.{}'.format(*CURRENT))") >> $env:GITHUB_OUTPUT
        Write-Output NVDA_API_COMPAT_TO=$(python -c "import sys; sys.path.append('source'); from addonAPIVersion import BACK_COMPAT_TO; print('{}.{}.{}'.format(*BACK_COMPAT_TO))") >> $env:GITHUB_OUTPUT

  typeCheck:
    name: Check types with Pyright
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    permissions:
      contents: read
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ env.defaultPythonVersion }}-${{ env.defaultArch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Static type analysis
      run: ci/scripts/tests/typeCheck.ps1

  checkPo:
    # BEGIN JP PATCH (temporarily disabled, to be fixed in a separate branch)
    if: false
    # END JP PATCH (temporarily disabled, to be fixed in a separate branch)
    name: Check po files for errors
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: matrix
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # Include gettext
        submodules: true
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Run pre-commit
      run: |
        # Ensure uv environment is up to date.
        # If the uv environment is outdated, running pre-commit will trigger uv to generate a uv.lock file,
        # which causes checkPo to fail without clear errors because pre-commit fails when files are changed during its run.
        uv run pre-commit run uv-lock --all-files
        # Run pre-commit on the translations
        uv run pre-commit run checkPo --all-files
    - name: Add job summary
      if: ${{ failure() }}
      shell: bash
      run: |
        echo "PO files contain errors. Please fix them before merging." >> $GITHUB_STEP_SUMMARY

  checkPot:
    name: Check translator comments
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ env.defaultPythonVersion }}-${{ env.defaultArch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Check comments for translators
      run: ci/scripts/tests/translationCheck.ps1
    - name: Upload artifact
      if: ${{ success() || failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: makePot results
        path: |
          output/nvda.pot
          output/potSourceFileList.txt

  licenseCheck:
    name: Check license compatibility of dependencies
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    permissions:
      contents: read
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ env.defaultPythonVersion }}-${{ env.defaultArch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: License check
      run: ci/scripts/tests/licenseCheck.ps1

  unitTests:
    name: Run unit tests
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    env:
      uv-arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'x86' }}
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    # BEGIN JP PATCH (overwrite JTalk files from dedicated artifact after workspace cache restore)
    - name: Get JTalk runtime artifact
      uses: actions/download-artifact@v8
      with:
        name: JTalk runtime (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: .
    # END JP PATCH
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: ${{ matrix.arch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: cpython-${{ matrix.pythonVersion }}-windows-${{ env.uv-arch }}-none
    - name: Run unit tests
      id: unit-tests
      run: ci/scripts/tests/unitTests.ps1
    - name: Replace relative paths in unit test results
      if: failure() && steps.unit-tests.outcome == 'failure'
      # Junit reports fail on these
      shell: bash
      run: sed -i 's|file="..\\|file="|g' testOutput/unit/unitTests.xml
    - name: Upload artifact
      if: failure() && steps.unit-tests.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: Unit tests results (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: testOutput/unit/unitTests.xml
    - name: Publish unit test report
      uses: mikepenz/action-junit-report@v6
      if: failure() && steps.unit-tests.outcome == 'failure'
      with:
        check_name: Unit tests (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        detailed_summary: true
        annotate_only: true
        report_paths: testOutput/unit/unitTests.xml

  # BEGIN JP PATCH (JP-specific smoke tests)
  jpSmokeTests:
    name: Run JP Braille/JTalk smoke tests
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    env:
      uv-arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'x86' }}
      UV_PYTHON_PREFERENCE: managed
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    # BEGIN JP PATCH (overwrite JTalk files from dedicated artifact after workspace cache restore)
    - name: Get JTalk runtime artifact
      uses: actions/download-artifact@v8
      with:
        name: JTalk runtime (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: .
    # END JP PATCH
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: ${{ matrix.arch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: cpython-${{ matrix.pythonVersion }}-windows-${{ env.uv-arch }}-none
    - name: Run JP smoke tests
      shell: pwsh
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      # SkipOverlay: use buildNVDA JTalk artifact; UTF-8 verify path (no chcp 932 in GHA).
      run: ./jptools/runJpSmokeTests.ps1 -SkipInstall -SkipOverlay
    - name: Upload JP smoke test artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: JP smoke test results (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: |
          __translator2output.txt
          __translator1output.txt
          __eng2output.txt
          __translator_louis_output.txt
          jpSmokeTests.log
          source/synthDrivers/jtalk/mecab_debug.log
  # END JP PATCH

  crowdinUpload:
    name: Upload translations to Crowdin
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA, checkPot]
    # BEGIN JP PATCH (disable crowdin upload)
    if: ${{ false }}
    # END JP PATCH
    # Original condition: if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/beta' && vars.CROWDIN_PROJECT_ID }}
    permissions:
      contents: read
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ env.defaultPythonVersion }}-${{ env.defaultArch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Get makePot results
      uses: actions/download-artifact@v8
      with:
        name: makePot results
        path: output
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Upload translations to Crowdin
      env:
        crowdinProjectID: ${{ vars.CROWDIN_PROJECT_ID }}
        crowdinAuthToken: ${{ secrets.CROWDIN_AUTH_TOKEN }}
      run: uv run --with requests --directory ${{ github.workspace }} ci\scripts\crowdinSync.py uploadSourceFile 2 output\nvda.pot 2>&1

  createLauncher:
    name: Create launcher
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    env:
      uv-arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'x86' }}
      # BEGIN JP PATCH (enable Azure Key Vault signing via repository variable, workflow_dispatch only)
      AZURE_KV_SIGNING: ${{ github.event_name == 'workflow_dispatch' && vars.AZURE_KV_SIGNING || '' }}
      # END JP PATCH
      # BEGIN JP PATCH (use nowdate computed once in matrix job)
      NOWDATE: ${{ needs.matrix.outputs.nowdate }}
      # END JP PATCH
    outputs:
      # Note: each output variable is overwritten by the last job in the matrix.
      # So we only set the output variables for the default architecture.
      launcherArtifactId: ${{ steps.addJobSummary.outputs.artifactId }}
      launcherSha256: ${{ steps.addJobSummary.outputs.SHA256 }}
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    # BEGIN JP PATCH (overwrite packaged JTalk files from dedicated artifact after workspace cache restore)
    - name: Get JTalk runtime artifact
      uses: actions/download-artifact@v8
      with:
        name: JTalk runtime (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: .
    # END JP PATCH
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: ${{ matrix.arch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: cpython-${{ matrix.pythonVersion }}-windows-${{ env.uv-arch }}-none
    - name: Set version variables
      run: ci/scripts/setBuildVersionVars.ps1
    - name: Set scons args
      run: ci/scripts/setSconsArgs.ps1
      env:
        apiSigningToken: ${{ github.event_name == 'push' && secrets.API_SIGNING_TOKEN || '' }}
    # BEGIN JP PATCH (Azure Key Vault signing with OIDC - workflow_dispatch only)
    - name: Login to Azure for Key Vault signing
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set Azure Key Vault access token
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      shell: pwsh
      run: |
        $token = (az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)
        if (-not $token) { throw "Failed to obtain Azure Key Vault access token" }
        Write-Host "::add-mask::$token"
        "AZURE_KV_ACCESS_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # END JP PATCH
    - name: Build scons docs targets
      shell: cmd
      run: scons %sconsDocsOutTargets% %sconsArgs% %sconsCores%
    # Run launcher separately as we can't safely generate that in parallel to docs scons targets (#18867)
    - name: Install signpath
      env:
        apiSigningToken: ${{ github.event_name == 'push' && secrets.API_SIGNING_TOKEN || '' }}
      if: ${{ env.apiSigningToken }}
      shell: cmd
      run: |
        PowerShell -Command "Set-ExecutionPolicy Bypass"
        PowerShell -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted"
        PowerShell -Command "Install-Module -Name SignPath -Force"
    # BEGIN JP PATCH (install AzureSignTool before Azure KV signing)
    - name: Install AzureSignTool
      if: ${{ env.AZURE_KV_SIGNING == '1' }}
      shell: pwsh
      run: |
        dotnet tool install --global AzureSignTool --version 7.0.1
        Join-Path $env:USERPROFILE ".dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # END JP PATCH
    - name: Build NVDAController client
      shell: cmd
      run: scons client %sconsArgs% %sconsCores%
    - name: Create NVDA launcher
      shell: cmd
      run: scons %sconsLauncherOutTargets% %sconsArgs%
    - name: Rename controller client archive for JP release
      shell: pwsh
      if: ${{ github.ref_name == 'alphajp' && github.event_name == 'workflow_dispatch' }}
      run: |
        $cc = Get-ChildItem -Path output -Filter "nvda_*controllerClient.zip" | Select-Object -First 1
        if ($cc) {
          $newName = "output/nvda_$env:version`_controllerClientJp.zip"
          Move-Item -LiteralPath $cc.FullName -Destination $newName -Force
          Write-Host "Renamed controller client to $newName"
        }
    - name: Upload launcher
      id: uploadLauncher
      uses: actions/upload-artifact@v7
      with:
        name: NVDA launcher (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: |
          output/nvda*.exe
          output/nvda*controllerClient*.zip
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      id: uploadBuildArtifacts
      with:
        name: Documentation files and packaging metadata (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: |
          output/*.html
          output/*.css
          output/library_modules.txt
          output/installed_python_packages.txt
    - name: Add job summary
      id: addJobSummary
      shell: bash
      run: |
        NVDA_EXE_NAME=$(ls output/nvda*.exe | head -n 1)
        SHA256=$(sha256sum "$NVDA_EXE_NAME" | cut -d ' ' -f 1)
        # If architecture is default we save the build details to the output variable
        if [ "${{ matrix.arch == env.defaultArch && matrix.pythonVersion == env.defaultPythonVersion }}" == "true" ]; then
            echo SHA256=$SHA256 >> $GITHUB_OUTPUT
            echo artifactId=${{ steps.uploadLauncher.outputs.artifact-id }} >> $GITHUB_OUTPUT
        fi
        echo "* [Download the NVDA launcher (${{ matrix.pythonVersion }}, ${{ matrix.arch }})](${{ steps.uploadLauncher.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "    * SHA256 of launcher exe file: \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
        echo "* [Download the documentation and other build artifacts](${{ steps.uploadBuildArtifacts.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "    * User guide, change log, developer guide" >> $GITHUB_STEP_SUMMARY
        echo "    * Packaging metadata: library modules, installed python packages" >> $GITHUB_STEP_SUMMARY

  systemTests:
    name: Run system tests
    runs-on: ${{ matrix.runner }}
    needs: [matrix, createLauncher]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # To skip tests, and just run install, replace with [excluded_from_build]
        # BEGIN JP PATCH (exclude vscode test suite; exclude symbols: Speech did not finish before timeout in CI)
        testSuite:
          - installer
          - startupShutdown
          # - symbols  # nvdajp: excluded (symbolPronunciationTests timeout in CI)
          # - vscode  # nvdajp: excluded
          # - chrome_annotations  # nvdajp: excluded
          # - chrome_list  # nvdajp: excluded
          # - chrome_table  # nvdajp: excluded
          # - chrome_language  # nvdajp: excluded
          # - chrome_roleDescription  # nvdajp: excluded
          # - chrome_misc_aria  # nvdajp: excluded
          # - chrome_misc  # nvdajp: excluded
          # - chrome_link  # nvdajp: excluded (added upstream)
        # END JP PATCH (exclude vscode test suite)
        runner: ${{ fromJson(needs.matrix.outputs.supportedRunners) }}
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
        # A bug exists with Windows 2022 notepad that prevents NVDA from focusing it.
        # This causes our symbol pronunciation tests to fail on this runner.
        exclude:
          - runner: windows-2022
            testSuite: symbols
    env:
      uv-arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'x86' }}
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pythonVersion }}
        architecture: ${{ matrix.arch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: cpython-${{ matrix.pythonVersion }}-windows-${{ env.uv-arch }}-none
    - name: Get NVDA launcher
      id: getLauncher
      uses: actions/download-artifact@v8
      with:
        name: NVDA launcher (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: output
    - name: Install NVDA
      run: ci/scripts/installNVDA.ps1
      env:
        nvdaLauncherDir: ${{ steps.getLauncher.outputs.download-path }}
    - name: Download and install Visual Studio Code
      if: ${{ matrix.testSuite == 'vscode' }}
      run: choco install -y vscode
    - name: Run system tests
      run: ci/scripts/tests/systemTests.ps1
      env:
        nvdaLauncherDir: ${{ steps.getLauncher.outputs.download-path }}
        INCLUDE_SYSTEM_TEST_TAGS: ${{ matrix.testSuite }}
        # BEGIN JP PATCH (exclude flaky tests that are skipped in certBuild2025.ps1; skip_in_ci for symbolPronunciationTests)
        EXCLUDE_SYSTEM_TEST_TAGS: restarts_on_crash skip_in_ci
        # END JP PATCH (exclude flaky tests that are skipped in certBuild2025.ps1; skip_in_ci for symbolPronunciationTests)
    - name: Upload system tests results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: "System tests results (${{ matrix.testSuite }}) (${{ matrix.runner }}, ${{ matrix.pythonVersion }}, ${{ matrix.arch }})"
        path: |
          testOutput/system
          testOutput/install
          !testOutput/install/nvda_install_temp.log
    - name: Publish system test report
      uses: mikepenz/action-junit-report@v6
      if: ${{ failure() }}
      with:
        check_name: "System tests (${{ matrix.testSuite }}) (${{ matrix.runner }}, ${{ matrix.pythonVersion }}, ${{ matrix.arch }})"
        detailed_summary: true
        annotate_only: true
        report_paths: testOutput/system/systemTests.xml

  createSymbols:
    name: Create symbols
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    outputs:
      # Note: each output variable is overwritten by the last job in the matrix.
      # So we only set the output variables for the default architecture.
      symbolsArtifactId: ${{ steps.defaultArtifact.outputs.artifactId }}
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Windows SDK
      # Installs symstore.exe to expected location.
      run: choco install -y windows-sdk-10.1
    - name: Create build symbols
      env:
        symStore: C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\symstore.exe
      run: ci/scripts/buildSymbolStore.ps1
    - name: Upload symbols artifact
      id: uploadArtifact
      uses: actions/upload-artifact@v7
      with:
        name: Symbols (${{ matrix.pythonVersion }}, ${{ matrix.arch }})
        path: output/symbols.zip
    - name: Save artifact metadata
      shell: bash
      id: defaultArtifact
      if: ${{ matrix.arch == env.defaultArch && matrix.pythonVersion == env.defaultPythonVersion }}
      run: echo artifactId=${{ steps.uploadArtifact.outputs.artifact-id }} >> $GITHUB_OUTPUT

  allTestsPass:
    # Is a no-op action.
    # Rulesets require specifying every job you wish to block a PR/push.
    # Used to protect branches/tags as a general status check so we can check a single job for all rulesets.
    name: Check if all tests pass
    runs-on: ubuntu-latest
    if: always()
    needs: [buildNVDA, typeCheck, checkPot, licenseCheck, unitTests, createLauncher, systemTests, createSymbols
      # BEGIN JP PATCH
      , jpSmokeTests
      # END JP PATCH
      # BEGIN JP PATCH (checkPo temporarily disabled)
      # , checkPo
      # END JP PATCH (checkPo temporarily disabled)
    ]
    permissions:
      contents: read
    steps:
    - name: Check if all tests pass
      uses: re-actors/alls-green@v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}

  uploadSymbols:
    name: Upload symbols
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    needs: [matrix, buildNVDA]
    if: ${{ github.event_name == 'push' && vars.feature_uploadSymbolsToMozilla }}
    permissions:
      contents: read
    steps:
    - name: Checkout cached build
      uses: actions/cache/restore@v5
      with:
        path: .
        key: ${{ github.ref }}-${{ github.run_id }}-${{ env.defaultPythonVersion }}-${{ env.defaultArch }}${{ env.SCONS_CACHE_SUFFIX }}
        fail-on-cache-miss: true
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.defaultPythonVersion }}
        architecture: ${{ env.defaultArch }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Get symbols
      uses: actions/download-artifact@v8
      with:
        name: Symbols (${{ env.defaultPythonVersion }}, ${{ env.defaultArch }})
        path: output
    - name: Upload symbols to Mozilla
      continue-on-error: true
      run: uv run --with requests --directory ${{ github.workspace }} ci\scripts\mozillaSyms.py
      env:
        mozillaSymsAuthToken: ${{ secrets.MOZILLA_SYMS_TOKEN }}
    - name: Warn on failure
      if: ${{ failure() }}
      shell: bash
      run: |
        echo "Warning: Uploading symbols to Mozilla failed." >> $GITHUB_STEP_SUMMARY

  cleanupCache:
    # Cache deletion on pull_request events cannot occur on PRs from forks
    # as PRs from forks do not get write permissions from pull_request events.
    # Alternatively, we can change the event trigger to pull_request_target,
    # however that might introduce security risks as it grants fork PRs greater permissions.
    # In these cases we can always let GitHub handle cache deletion:
    # auto deletion after 7 days or limits are hit
    name: Cleanup cache
    permissions:
      actions: write
    needs: [matrix, allTestsPass, crowdinUpload, uploadSymbols]
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.owner == github.repository_owner }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix.outputs.supportedArchitectures) }}
        pythonVersion: ${{ fromJson(needs.matrix.outputs.supportedPythonVersions) }}
    steps:
      - name: Cleanup cache
        shell: bash
        run: gh cache delete ${{ github.ref }}-${{ github.run_id }}-${{ matrix.pythonVersion }}-${{ matrix.arch }}${{ env.SCONS_CACHE_SUFFIX }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploySnapshot:
    name: Deploy NVDA snapshot
    permissions:
      contents: write
      deployments: write
    runs-on: ubuntu-latest
    needs: [buildNVDA, createLauncher, createSymbols, allTestsPass]
    # BEGIN JP PATCH (nvdajp: snapshot deployment disabled - no secrets in CI)
    if: false
    # END JP PATCH
    # Original upstream condition: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'release-') }}
    concurrency:
      group: snapshot-${{ github.ref_name }}
      cancel-in-progress: true
    environment:
      name: snapshot
    steps:
    - name: Get NVDA launcher
      uses: actions/download-artifact@v8
      with:
        name: NVDA launcher (${{ env.defaultPythonVersion }}, ${{ env.defaultArch }})
        path: output
    - name: Deploy snapshot
      shell: bash
      id: deploySnapshot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NVDA_EXE_NAME=$(ls output/nvda*.exe | head -n 1)
        NVDA_HASH=$(sha1sum "$NVDA_EXE_NAME" | cut -d ' ' -f 1)

        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/${{ github.repository }}/deployments \
          -f "task=release" \
          -f "description=Release of $NVDA_EXE_NAME" \
          -f "ref=${{ github.ref_name }}" \
          -F "auto_merge=false" \
          -f "environment=snapshot" \
          -f "required_contexts[]" \
          -f "payload[NVDA_HASH]=$NVDA_HASH" \
          -f "payload[NVDA_ARTIFACT_ID]=${{ needs.createLauncher.outputs.launcherArtifactId }}" \
          -f "payload[SYMBOLS_ARTIFACT_ID]=${{ needs.createSymbols.outputs.symbolsArtifactId }}" \
          -f "payload[NVDA_VERSION]=${{ needs.buildNVDA.outputs.version }}" \
          -f "payload[NVDA_VERSION_TYPE]=${{ needs.buildNVDA.outputs.versionType }}" \
          -f "payload[NVDA_API_VERSION]=${{ needs.buildNVDA.outputs.APIVersion }}" \
          -f "payload[NVDA_API_COMPAT_TO]=${{ needs.buildNVDA.outputs.APIBackCompat }}"

  release:
    name: Release NVDA
    permissions:
      contents: write
      deployments: write
      discussions: write
    runs-on: ubuntu-latest
    needs: [buildNVDA, createLauncher, createSymbols, allTestsPass]
    # BEGIN JP PATCH (nvdajp: release deployment disabled - no secrets in CI)
    if: false
    # END JP PATCH
    # Original upstream condition: startsWith(github.ref_name, 'release-')
    concurrency:
      group: release
      cancel-in-progress: true
    environment:
      name: production
    steps:
    - name: Get normalized tag names
      id: getReleaseNotes
      shell: bash
      run: |
        echo RELEASE_NAME=$GITHUB_REF_NAME | sed 's/release-//g' >> $GITHUB_OUTPUT
        echo NORMALIZED_TAG_NAME=$GITHUB_REF_NAME | sed 's/\./-/g' | sed 's/release-//g' >> $GITHUB_OUTPUT
    - name: Get NVDA launcher
      uses: actions/download-artifact@v8
      with:
        name: NVDA launcher (${{ env.defaultPythonVersion }}, ${{ env.defaultArch }})
        path: output
    - name: VirusTotal Scan
      id: virusTotal
      uses: crazy-max/ghaction-virustotal@v5.0.0
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        files: output/nvda*.exe
    - name: Get normalized VT url
      id: getVTUrl
      shell: bash
      run: |
        vtUrl=$(echo ${{ steps.virusTotal.outputs.analysis }} | sed -E 's/([^=]*)=([^,]*).*/\2/')
        echo VT_URL=$vtUrl >> $GITHUB_OUTPUT
    - name: Deploy release
      shell: bash
      id: deployRelease
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NVDA_EXE_NAME=$(ls output/nvda*.exe | head -n 1)
        NVDA_HASH=$(sha1sum "$NVDA_EXE_NAME" | cut -d ' ' -f 1)

        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/${{ github.repository }}/deployments \
          -f "task=release" \
          -f "description=Release of $NVDA_EXE_NAME" \
          -f "ref=${{ github.ref_name }}" \
          -F "auto_merge=false" \
          -f "environment=production" \
          -f "required_contexts[]" \
          -f "payload[NVDA_HASH]=$NVDA_HASH" \
          -f "payload[NVDA_ARTIFACT_ID]=${{ needs.createLauncher.outputs.launcherArtifactId }}" \
          -f "payload[SYMBOLS_ARTIFACT_ID]=${{ needs.createSymbols.outputs.symbolsArtifactId }}" \
          -f "payload[NVDA_VERSION]=${{ needs.buildNVDA.outputs.version }}" \
          -f "payload[NVDA_VERSION_TYPE]=${{ needs.buildNVDA.outputs.versionType }}" \
          -f "payload[NVDA_API_VERSION]=${{ needs.buildNVDA.outputs.APIVersion }}" \
          -f "payload[NVDA_API_COMPAT_TO]=${{ needs.buildNVDA.outputs.APIBackCompat }}"
    - name: Create release notes
      id: createReleaseNotes
      shell: bash
      run: |
        echo "* Highlights can be found in the [release blog post](https://www.nvaccess.org/post/nvda-${{ steps.getReleaseNotes.outputs.NORMALIZED_TAG_NAME }}/)." >> /tmp/releaseNotes.md
        echo "* [VirusTotal scan results](${{ steps.getVTUrl.outputs.VT_URL }})" >> /tmp/releaseNotes.md
        echo "* SHA256 sum: \`${{ needs.createLauncher.outputs.launcherSha256 }}\`" >> /tmp/releaseNotes.md
    - name: Publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NVDA_EXE_NAME=$(ls output/nvda*.exe | head -n 1)
        gh release create ${{ github.ref_name }} \
          --repo ${{ github.repository }} \
          --title "${{ steps.getReleaseNotes.outputs.RELEASE_NAME }}" \
          --notes-file /tmp/releaseNotes.md \
          --verify-tag \
          --discussion-category Releases \
          ${{ ( contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') ) && '--prerelease' || '' }} \
          $NVDA_EXE_NAME#Installer

  publishAlphaRelease:
    name: Publish alpha pre-release
    permissions:
      contents: write
      # BEGIN JP PATCH (AWS OIDC federation for S3 alpha-meta.json upload)
      id-token: write
      # END JP PATCH
    runs-on: ubuntu-latest
    needs: [matrix, buildNVDA, createLauncher, createSymbols, allTestsPass]
    # BEGIN JP PATCH (nvdajp: publish alpha pre-release on workflow_dispatch only, and only on alphajp branch)
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'alphajp'
    # END JP PATCH
    concurrency:
      group: alpha-release
      cancel-in-progress: true
    steps:
    # BEGIN JP PATCH (use nowdate computed once in matrix job)
    - name: Determine tag
      shell: bash
      id: tag
      run: |
        tag="alphajp-${{ needs.matrix.outputs.nowdate }}"
        echo "TAG=$tag" >> "$GITHUB_OUTPUT"
        echo "URL=https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_OUTPUT"
    # END JP PATCH
    - name: Download NVDA launcher and JP addons
      uses: actions/download-artifact@v8
      with:
        name: NVDA launcher (${{ env.defaultPythonVersion }}, ${{ env.defaultArch }})
        path: output
    - name: Download JP addons
      uses: actions/download-artifact@v8
      with:
        name: JP addons (${{ env.defaultPythonVersion }}, ${{ env.defaultArch }})
        path: jptools
    - name: Calculate hashes
      shell: bash
      id: hashes
      run: |
        exe=$(ls output/nvda*.exe | head -n 1)
        echo "EXE_NAME=$(basename "$exe")" >> "$GITHUB_OUTPUT"
        echo "SHA1=$(sha1sum "$exe" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        echo "SHA256=$(sha256sum "$exe" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Create pre-release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${{ steps.tag.outputs.TAG }}"
        gh release create "$tag" \
          "output/${{ steps.hashes.outputs.EXE_NAME }}" \
          jptools/nvdajp-jtalk-*.nvda-addon \
          jptools/kgsbraille-*.nvda-addon \
          output/nvda_*_controllerClientJp.zip \
          --repo ${{ github.repository }} \
          --title "NVDA Japanese alpha ${{ needs.buildNVDA.outputs.version }}" \
          --notes "$(printf '%s\nSHA1: %s\nSHA256: %s\n' '${{ steps.hashes.outputs.EXE_NAME }}' '${{ steps.hashes.outputs.SHA1 }}' '${{ steps.hashes.outputs.SHA256 }}')" \
          --prerelease
    # BEGIN JP PATCH (S3 alpha-meta.json upload via AWS OIDC, no long-term keys)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ALPHA_ROLE_ARN }}
        aws-region: ap-northeast-1
    - name: Upload alpha-meta.json to S3
      shell: bash
      run: |
        cat > alpha-meta.json <<EOF
        {
          "version": "${{ needs.buildNVDA.outputs.version }}",
          "launcherUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG }}/${{ steps.hashes.outputs.EXE_NAME }}",
          "sha1": "${{ steps.hashes.outputs.SHA1 }}",
          "sha256": "${{ steps.hashes.outputs.SHA256 }}",
          "apiVersion": "${{ needs.buildNVDA.outputs.APIVersion }}",
          "apiCompatTo": "${{ needs.buildNVDA.outputs.APIBackCompat }}"
        }
        EOF
        aws s3 cp alpha-meta.json s3://nvdajp/alpha/alpha-meta.json --content-type application/json --acl public-read
    # END JP PATCH
    outputs:
      releaseTag: ${{ steps.tag.outputs.TAG }}
      releaseUrl: ${{ steps.tag.outputs.URL }}
      exeName: ${{ steps.hashes.outputs.EXE_NAME }}
      sha1: ${{ steps.hashes.outputs.SHA1 }}
      sha256: ${{ steps.hashes.outputs.SHA256 }}
      version: ${{ needs.buildNVDA.outputs.version }}

  submit-winget:
    name: Submit manifest to WinGet Packages Repository
    needs: [matrix, release]
    runs-on: ${{ needs.matrix.outputs.defaultRunner }}
    if: startsWith(github.ref_name, 'release-')
    permissions:
      contents: read
    steps:
    - name: Checkout NVDA
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Submit package using wingetcreate
      env:
        GH_TOKEN: ${{ github.token }}
        # wingetcreate will read the token from the below environment variable
        # Reference: https://aka.ms/winget-create-token
        WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
      run: ci/scripts/submitWinGet.ps1
