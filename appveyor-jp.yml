os: Visual Studio 2022
version: "{branch}-{build}"

skip_tags: true
branches:
 only:
  - /alphajp.*/
  - /betajp.*/
  - /releasejp.*/

clone_depth: 1

environment:
 PY_PYTHON: 3.11-32
 PATH: C:\Users\appveyor\.cargo\bin;C:\Users\appveyor\AppData\Local\Microsoft\WinGet\Packages\astral-sh.uv_astral-sh.uv\uv;%PATH%

init:
 - git config --global core.autocrlf true
 - ps: |
    $pythonVersion = (py --version)
    echo $pythonVersion
 - set PATH=%PATH%;C:\MinGW;C:\MinGW\bin;C:\MinGW\msys\1.0

install:
 - ps: |
    try {
        Write-Host "Installing uv..."
        
        # First try WinGet if available
        $hasWinGet = [bool](Get-Command winget -ErrorAction SilentlyContinue)
        if ($hasWinGet) {
            Write-Host "Attempting to install uv using WinGet..."
            & winget install --accept-source-agreements --disable-interactivity -e astral-sh.uv
            if ($LASTEXITCODE -eq 0) {
                Write-Host "uv installed successfully via WinGet"
                $env:PATH = "$env:USERPROFILE\AppData\Local\Microsoft\WinGet\Packages\astral-sh.uv_astral-sh.uv\uv;$env:PATH"
            } else {
                Write-Host "WinGet installation failed, trying official script..."
                throw "WinGet failed"
            }
        } else {
            Write-Host "WinGet not available, using official script..."
            throw "No WinGet"
        }
    } catch {
        Write-Host "Trying official uv installer script..."
        try {
            $installScript = Invoke-WebRequest -Uri https://astral.sh/uv/install.ps1 -UseBasicParsing
            if ($installScript.Content) {
                Invoke-Expression $installScript.Content
                $env:PATH += ";$env:USERPROFILE\.cargo\bin"
                Write-Host "uv installed successfully via official script"
            } else {
                throw "Failed to download installer script"
            }
        } catch {
            Write-Host "Official script failed, trying pip fallback..."
            try {
                pip install uv
                Write-Host "uv installed successfully via pip"
            } catch {
                Write-Error "All uv installation methods failed: $_"
                exit 1
            }
        }
    }
    
    # Verify uv installation
    try {
        $uvVersion = uv --version
        Write-Host "uv version: $uvVersion"
        
        # Update environment variables for the session
        $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:USERPROFILE\AppData\Local\Microsoft\WinGet\Packages\astral-sh.uv_astral-sh.uv\uv;$env:PATH"
        
        # Set Appveyor environment variable for other scripts
        Set-AppveyorBuildVariable "UV_AVAILABLE" "true"
        Set-AppveyorBuildVariable "UV_PATH" "$env:USERPROFILE\.cargo\bin"
    } catch {
        Write-Error "uv installation verification failed: $_"
        Set-AppveyorBuildVariable "UV_AVAILABLE" "false"
        exit 1
    }
 - set RELEASE=1
 - set VERSION=2025.1.2jp
 - set UPDATEVERSIONTYPE=nvdajp
 - for /F "usebackq" %%t in (`jptools\nowdate.cmd`) do set NOWDATE=%%t
 - ps: |
    if ($env:APPVEYOR_REPO_BRANCH.StartsWith("alphajp")) {
        $env:VERSION = "jpalpha_" + $env:NOWDATE
        $env:UPDATEVERSIONTYPE += "alpha"
    } elseif ($env:APPVEYOR_REPO_BRANCH.StartsWith("betajp")) {
        $env:VERSION += "-beta-" + $env:NOWDATE
        $env:UPDATEVERSIONTYPE += "beta"
    } elseif ($env:APPVEYOR_REPO_BRANCH.StartsWith("releasejp")) {
        $env:VERSION += "-" + $env:NOWDATE
    }
 - set PUBLISHER=nvdajp
 - echo %PUBLISHER% %UPDATEVERSIONTYPE% %VERSION%
 - py -m pip install --upgrade --no-warn-script-location pip
 - git submodule update --init --recursive

build_script:
 - ps: |
    $apiVersion = (py -c "import sys; sys.path.append('source'); from addonAPIVersion import CURRENT; print('{}.{}.{}'.format(*CURRENT))")
    echo apiversion: $apiVersion
    $apiCompatTo = (py -c "import sys; sys.path.append('source'); from addonAPIVersion import BACK_COMPAT_TO; print('{}.{}.{}'.format(*BACK_COMPAT_TO))")
    echo apiBackCompatTo: $apiCompatTo
 - ps: |
    $sconsArgs = "version_build=$env:APPVEYOR_BUILD_NUMBER"
    $sconsArgs += " --all-cores"
    Set-AppveyorBuildVariable "sconsArgs" $sconsArgs
 - 'echo jptools\nonCertAllBuild.cmd %sconsArgs%'
 - jptools\nonCertAllBuild.cmd %sconsArgs%
 - cd %APPVEYOR_BUILD_FOLDER%
 - cd jptools
 - pack_jtalk_addon.cmd
 - pack_kgs_addon.cmd
 - cd ..
 - jptools\buildControllerClient.cmd %sconsArgs%
 - jptools\testMiscDepsJp.cmd
 - jptools\tests.cmd
 - jpchar\tests.cmd

before_test:
 - ps: appveyor\scripts\tests\beforeTests.ps1
 - ps: appveyor\scripts\installNVDA.ps1

test_script:
 - ps: appveyor\scripts\tests\translationCheck.ps1
 - ps: appveyor\scripts\tests\licenseCheck.ps1
 - ps: appveyor\scripts\tests\unitTests.ps1
 - ps: appveyor\scripts\tests\systemTests.ps1

after_test:
 - ps: appveyor\scripts\tests\checkTestFailure.ps1

artifacts:
 - path: output\*
 - path: output\*\*
 - path: miscDepsJp\__mypy.txt
 - path: miscDepsJp\jptools\__h1output.txt
 - path: miscDepsJp\jptools\__h2output.txt
 - path: miscDepsJp\jptools\__test_log.txt
 - path: miscDepsJp\jptools\__jpBrailleHarness.md
 - path: miscDepsJp\jptools\jpBrailleHarness.html
 - path: jptools\__jpdictest_log.txt
 - path: jptools\nvdajp-jtalk-*.nvda-addon
 - path: jptools\kgsbraille-*.nvda-addon
 - path: jpchar\__checkchardesc_log.txt
